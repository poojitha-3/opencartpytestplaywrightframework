[pytest]

addopts= -v
         #--browser=chromium
         #--headed
         --screenshot=only-on-failure
         --video=retain-on-failure
         --tracing=retain-on-failure
         --base-url=https://tutorialsninja.com/demo/index.php
         --html=reports.html --self-contained-html --capture=tee-sys
         #-m "regression"
         #-n=2
         --alluredir=reports/allure-results

markers =
    sanity: sanity test cases
    regression: regression test cases
    end-to-end: end-to-end test cases
    datadriven: data-driven test cases